<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BRAINS Platform - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Multi-Agent Medical Diagnostic System Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Dark/Modern -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <!-- Custom CSS for Medical/AI Vibe -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: #0b1015;
    }

    #app {
      min-height: 100vh;
      width: 100%;
    }

    :root {
      --base-font-size: 16px;
      --theme-color: #00d2ff; /* Cyan for AI/Future feel */
      --link-color: #00d2ff;
      --sidebar-width: 300px;
      --base-background-color: #0b1015; /* Deep Navy/Black */
      --sidebar-background-color: #06090c;
    }

    /* Custom Accents */
    .markdown-section h1, .markdown-section h2 {
      color: #e2e8f0;
      font-weight: 600;
    }
    
    .markdown-section code {
      background-color: #1a232c;
      color: #7dd3fc;
    }

    /* Badge styling */
    img[src*="shields.io"] {
      margin-right: 5px;
    }
    
    /* Cover Page Buttons */
    .cover-main a.anchor span {
        color: #00d2ff;
    }

    /* Docsify cover page fix */
    .cover {
      height: auto;
      min-height: 100vh;
      background-position: center center;
      background-size: cover;
    }

    .cover.hide {
      display: none;
    }

    /* Content visibility fix */
    .markdown-section {
      padding: 40px 20px;
    }

    /* Ensure page content is visible and scrollable */
    main {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">Loading BRAINS...</div>
  
  <script>
    window.$docsify = {
      name: 'BRAINS <span style="font-size:0.6em; opacity:0.7;">PLATFORM</span>',
      repo: 'https://github.com/AbirBokhtiar/BRAINS', // REPLACE THIS
      
      // Configuration
      loadSidebar: false,    // Set to true if you want a custom sidebar file
      subMaxLevel: 3,        // Generates TOC automatically from headers
      auto2top: true,
      coverpage: true,       // Enables the landing page
      
      // Plugins
      search: {
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
